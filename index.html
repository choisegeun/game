<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남극 대탈출</title>
<style>
  html, body { margin: 0; height: 100%; background: #050a1a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 440;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// ---------- 사운드 ----------
let actx = null;
function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, actx.currentTime + dur);
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  jump: () => beep(520, 0.12, 'square', 0.05, 300),
  hit: () => beep(140, 0.3, 'sawtooth', 0.12, -80),
  fish: () => { beep(880, 0.08, 'triangle', 0.08); setTimeout(() => beep(1320, 0.1, 'triangle', 0.08), 70); },
  roar: () => { beep(90, 0.7, 'sawtooth', 0.15, -40); beep(130, 0.6, 'square', 0.06, -60); },
  fall: () => beep(400, 0.8, 'sine', 0.12, -350),
};

// ---------- 저장 ----------
let best = 0;
try { best = +localStorage.getItem('antarctic-dino-best') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('antarctic-dino-best', best); } catch (e) {} }

// ---------- 상태 ----------
let state = 'title'; // title | play | over
let t = 0, speed, dist, score, gap, objs, parts, spawnIn, fishIn, shake, overReason, roarCd, flash;
const P = { x: 330, y: GROUND, vy: 0, onGround: true, jumps: 0, slide: false, inv: 0, fall: false, anim: 0 };
let dinoX = 0, dinoBite = 0;

const snow = Array.from({ length: 120 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 0.5, s: Math.random() * 40 + 20 }));
const bergs = Array.from({ length: 8 }, (_, i) => ({ x: i * 160, h: 60 + Math.random() * 90, w: 120 + Math.random() * 100 }));
const hills = Array.from({ length: 10 }, (_, i) => ({ x: i * 120, h: 20 + Math.random() * 40, w: 140 + Math.random() * 80 }));

function reset() {
  speed = 360; dist = 0; score = 0; gap = 70; objs = []; parts = [];
  spawnIn = 1.2; fishIn = 2; shake = 0; roarCd = 0; flash = 0;
  Object.assign(P, { y: GROUND, vy: 0, onGround: true, jumps: 0, slide: false, inv: 0, fall: false });
  state = 'play';
  sfx.roar(); shake = 12;
}

// ---------- 입력 ----------
const keys = {};
function jump() {
  if (state !== 'play') { reset(); return; }
  if (P.fall) return;
  if (P.onGround || P.jumps < 2) {
    P.vy = P.jumps === 0 ? -800 : -680;
    P.jumps++; P.onGround = false; P.slide = false;
    sfx.jump();
    for (let i = 0; i < 6; i++) puff(P.x, P.y, '#e8f4ff');
  }
}
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyS'].includes(e.code)) e.preventDefault();
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
  if (e.code === 'Enter' && state !== 'play') reset();
});
addEventListener('keyup', e => { keys[e.code] = false; });
// 터치: 위쪽 절반 = 점프, 아래쪽 절반 = 누르고 있으면 슬라이드
let touchSlide = false;
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const y = (e.clientY - r.top) / r.height * H;
  if (state === 'play' && y > H * 0.6 && e.pointerType !== 'mouse') touchSlide = true;
  else jump();
});
addEventListener('pointerup', () => { touchSlide = false; });

// ---------- 오브젝트 ----------
function spawn() {
  const lvl = Math.min(1, dist / 6000);
  const r = Math.random();
  if (r < 0.38) {
    const big = Math.random() < 0.3 + lvl * 0.3;
    objs.push({ type: 'ice', x: W + 40, w: big ? 56 : 40, h: big ? 70 : 44 });
  } else if (r < 0.62) {
    objs.push({ type: 'crack', x: W + 40, w: 80 + Math.random() * (50 + lvl * 60), h: 0 });
  } else if (r < 0.85) {
    objs.push({ type: 'ptero', x: W + 60, w: 70, h: 30, y: GROUND - 62 - Math.random() * 8, flap: 0 });
  } else {
    // 고드름 기둥 두 개 연속
    objs.push({ type: 'ice', x: W + 40, w: 40, h: 44 });
    objs.push({ type: 'ice', x: W + 40 + 190 + speed * 0.15, w: 40, h: 44 });
  }
  spawnIn = (0.9 + Math.random() * 0.9) * (420 / speed) * (1.3 - lvl * 0.35);
}
function spawnFish() {
  const high = Math.random() < 0.5;
  const n = 3 + (Math.random() * 3 | 0);
  for (let i = 0; i < n; i++)
    objs.push({ type: 'fish', x: W + 40 + i * 42, y: high ? GROUND - 120 - Math.sin(i / (n - 1) * Math.PI) * 40 : GROUND - 30, w: 26, h: 16 });
  fishIn = 2 + Math.random() * 3;
}
function puff(x, y, c, n = 1) {
  for (let i = 0; i < n; i++)
    parts.push({ x, y, vx: (Math.random() - 0.5) * 220 - 80, vy: -Math.random() * 200, life: 0.6 + Math.random() * 0.4, c, r: 2 + Math.random() * 3 });
}

function overlapCrack(x0, x1) {
  return objs.some(o => o.type === 'crack' && x1 > o.x + 6 && x0 < o.x + o.w - 6);
}

// ---------- 업데이트 ----------
function update(dt) {
  t += dt;
  for (const s of snow) {
    s.y += s.s * dt; s.x -= (state === 'play' ? speed * 0.15 : 20) * dt + Math.sin(t + s.r) * 0.3;
    if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
    if (s.x < -5) s.x = W + 5;
  }
  const scroll = state === 'play' ? speed : (state === 'title' ? 120 : 0);
  for (const b of bergs) { b.x -= scroll * 0.1 * dt; if (b.x + b.w < 0) { b.x += 160 * 8; b.h = 60 + Math.random() * 90; } }
  for (const h of hills) { h.x -= scroll * 0.35 * dt; if (h.x + h.w < 0) { h.x += 120 * 10; h.h = 20 + Math.random() * 40; } }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  shake = Math.max(0, shake - 30 * dt);
  flash = Math.max(0, flash - dt * 2);

  if (state !== 'play') {
    if (state === 'over') { dinoBite += dt; }
    return;
  }

  // 속도/거리
  speed = Math.min(820, speed + 9 * dt);
  dist += speed * dt / 10;
  score = Math.floor(dist) + bonus;
  gap = Math.min(100, gap + 2.2 * dt);
  roarCd -= dt;
  if (gap < 28 && roarCd <= 0) { sfx.roar(); shake = 10; roarCd = 3.5; }

  // 스폰
  spawnIn -= dt; fishIn -= dt;
  if (spawnIn <= 0) spawn();
  if (fishIn <= 0) spawnFish();
  for (const o of objs) { o.x -= speed * dt; if (o.type === 'ptero') { o.x -= 80 * dt; o.flap += dt * 10; } }
  objs = objs.filter(o => o.x + o.w > -100 && !o.dead);

  // 플레이어
  const wantSlide = keys.ArrowDown || keys.KeyS || touchSlide;
  if (!P.fall) {
    if (wantSlide && !P.onGround) P.vy += 3000 * dt; // 공중에서 빠르게 낙하
    P.slide = wantSlide && P.onGround;
  }
  P.vy += 2300 * dt;
  P.y += P.vy * dt;
  P.inv = Math.max(0, P.inv - dt);
  P.anim += dt * speed / 40;

  const overGap = overlapCrack(P.x - 6, P.x + 6);
  if (!P.fall && P.y >= GROUND) {
    if (overGap) { P.fall = true; sfx.fall(); }
    else {
      if (!P.onGround) for (let i = 0; i < 4; i++) puff(P.x, GROUND, '#dbeeff');
      P.y = GROUND; P.vy = 0; P.onGround = true; P.jumps = 0;
    }
  }
  if (P.onGround && overGap && !P.fall) { P.onGround = false; P.fall = true; sfx.fall(); }
  if (P.fall && P.y > H + 60) return gameOver('크레바스에 빠졌다!');
  if (P.onGround && wantSlide && Math.random() < 0.5) puff(P.x - 10, GROUND, '#ffffff');

  // 충돌
  const ph = P.slide ? 24 : 52, pw = P.slide ? 50 : 34;
  const px0 = P.x - pw / 2, px1 = P.x + pw / 2, py0 = P.y - ph, py1 = P.y;
  for (const o of objs) {
    let ox0 = o.x, ox1 = o.x + o.w, oy0, oy1;
    if (o.type === 'ice') { oy0 = GROUND - o.h; oy1 = GROUND; ox0 += 4; ox1 -= 4; }
    else if (o.type === 'ptero') { oy0 = o.y - 10; oy1 = o.y + 14; ox0 += 10; ox1 -= 10; }
    else if (o.type === 'fish') { oy0 = o.y - 12; oy1 = o.y + 12; ox0 -= 4; ox1 += 4; }
    else continue;
    if (px1 > ox0 && px0 < ox1 && py1 > oy0 && py0 < oy1) {
      if (o.type === 'fish') {
        o.dead = true; bonus += 50; gap = Math.min(100, gap + 4); sfx.fish();
        for (let i = 0; i < 5; i++) puff(o.x, o.y, '#ffd34d');
      } else if (P.inv <= 0) {
        o.dead = true; P.inv = 1.2; gap -= o.type === 'ptero' ? 22 : 26; speed *= 0.82;
        shake = 14; flash = 0.6; sfx.hit();
        for (let i = 0; i < 14; i++) puff(o.x + o.w / 2, (oy0 + oy1) / 2, o.type === 'ice' ? '#a8ddff' : '#8a6a5a');
      }
    }
  }
  if (gap <= 0) { gap = 0; return gameOver('공룡에게 잡혔다!'); }
}
let bonus = 0;
function gameOver(reason) {
  state = 'over'; overReason = reason; dinoBite = 0;
  if (reason.includes('공룡')) { sfx.roar(); shake = 20; }
  if (score > best) { best = score; saveBest(); }
}
const _reset = reset;
reset = function () { bonus = 0; _reset(); };

// ---------- 그리기 ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#060b24'); g.addColorStop(0.6, '#15305a'); g.addColorStop(1, '#3d6d99');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 별
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 50; i++) {
    const x = (i * 197) % W, y = (i * 71) % 200;
    ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(t * 1.5 + i));
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
  // 오로라
  for (let k = 0; k < 3; k++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 20) {
      const y = 80 + k * 26 + Math.sin(x * 0.006 + t * 0.6 + k) * 30 + Math.sin(x * 0.017 - t * 0.4) * 12;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    for (let x = W; x >= 0; x -= 20) {
      const y = 150 + k * 26 + Math.sin(x * 0.006 + t * 0.6 + k) * 30 + Math.sin(x * 0.011 + t) * 20;
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    const ag = ctx.createLinearGradient(0, 60, 0, 230);
    ag.addColorStop(0, `rgba(${k === 1 ? '160,90,255' : '60,255,170'},0)`);
    ag.addColorStop(0.5, `rgba(${k === 1 ? '160,90,255' : '60,255,170'},0.18)`);
    ag.addColorStop(1, 'rgba(60,255,170,0)');
    ctx.fillStyle = ag; ctx.fill();
  }
  // 빙산 (원경)
  ctx.fillStyle = '#7fa6c9';
  for (const b of bergs) {
    ctx.beginPath();
    ctx.moveTo(b.x, GROUND - 40);
    ctx.lineTo(b.x + b.w * 0.3, GROUND - 40 - b.h);
    ctx.lineTo(b.x + b.w * 0.55, GROUND - 40 - b.h * 0.8);
    ctx.lineTo(b.x + b.w * 0.7, GROUND - 40 - b.h * 0.95);
    ctx.lineTo(b.x + b.w, GROUND - 40);
    ctx.fill();
  }
  ctx.fillStyle = '#b9d4ea';
  for (const h of hills) {
    ctx.beginPath();
    ctx.ellipse(h.x + h.w / 2, GROUND - 4, h.w / 2, h.h, 0, Math.PI, 0);
    ctx.fill();
  }
}

function drawGround() {
  const cracks = objs.filter(o => o.type === 'crack').sort((a, b) => a.x - b.x);
  let x = 0;
  const segs = [];
  for (const c of cracks) { if (c.x > x) segs.push([x, c.x]); x = Math.max(x, c.x + c.w); }
  if (x < W) segs.push([x, W]);
  for (const [a, b] of segs) {
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#f4fbff'); g.addColorStop(0.15, '#cfe6f7'); g.addColorStop(1, '#8fb8d8');
    ctx.fillStyle = g; ctx.fillRect(a, GROUND, b - a, H - GROUND);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(a, GROUND, b - a, 4);
  }
  // 크레바스 내부
  for (const c of cracks) {
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#5aa6d6'); g.addColorStop(1, '#061a33');
    ctx.fillStyle = g; ctx.fillRect(c.x, GROUND, c.w, H - GROUND);
    ctx.fillStyle = '#3e88bd';
    ctx.beginPath(); ctx.moveTo(c.x, GROUND); ctx.lineTo(c.x + 14, H); ctx.lineTo(c.x, H); ctx.fill();
    ctx.beginPath(); ctx.moveTo(c.x + c.w, GROUND); ctx.lineTo(c.x + c.w - 14, H); ctx.lineTo(c.x + c.w, H); ctx.fill();
  }
  // 땅 질감
  ctx.fillStyle = 'rgba(120,170,210,0.35)';
  const off = (dist * 10) % 90;
  for (let i = -1; i < 12; i++) {
    const gx = i * 90 - off;
    if (!overlapCrack(gx, gx + 30)) ctx.fillRect(gx, GROUND + 22 + (i % 3) * 18, 30, 3);
  }
}

function drawIce(o) {
  const x = o.x, y = GROUND - o.h;
  const g = ctx.createLinearGradient(x, y, x + o.w, GROUND);
  g.addColorStop(0, '#e9f8ff'); g.addColorStop(1, '#6fc0ec');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x, GROUND); ctx.lineTo(x + 4, y + 10); ctx.lineTo(x + o.w * 0.35, y);
  ctx.lineTo(x + o.w * 0.6, y + 8); ctx.lineTo(x + o.w - 3, y + 4); ctx.lineTo(x + o.w, GROUND);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 10, y + 14); ctx.lineTo(x + 14, GROUND - 10); ctx.stroke();
}

function drawPtero(o) {
  const x = o.x + o.w / 2, y = o.y, f = Math.sin(o.flap) * 18;
  ctx.fillStyle = '#7a4f3a';
  // 날개
  ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x - 38, y - f); ctx.lineTo(x - 4, y + 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 6, y); ctx.lineTo(x + 34, y - f * 0.9); ctx.lineTo(x + 4, y + 8); ctx.fill();
  // 몸
  ctx.fillStyle = '#9b6650';
  ctx.beginPath(); ctx.ellipse(x, y + 3, 16, 7, 0, 0, Math.PI * 2); ctx.fill();
  // 머리 + 볏 + 부리 (왼쪽 향함)
  ctx.beginPath(); ctx.arc(x - 16, y - 2, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 20, y - 2); ctx.lineTo(x - 40, y + 2); ctx.lineTo(x - 20, y + 3); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 12, y - 6); ctx.lineTo(x + 2, y - 14); ctx.lineTo(x - 10, y - 2); ctx.fill();
  ctx.fillStyle = '#ffde59'; ctx.fillRect(x - 19, y - 4, 3, 3);
}

function drawFish(o) {
  const x = o.x + 13, y = o.y + Math.sin(t * 6 + o.x * 0.05) * 3;
  ctx.fillStyle = '#ffcf3f';
  ctx.beginPath(); ctx.ellipse(x, y, 12, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 9, y); ctx.lineTo(x + 18, y - 7); ctx.lineTo(x + 18, y + 7); ctx.fill();
  ctx.fillStyle = '#1b2440'; ctx.fillRect(x - 7, y - 3, 3, 3);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, 5, -1, 1); ctx.stroke();
}

function drawPenguin() {
  if (P.inv > 0 && Math.floor(P.inv * 12) % 2 === 0) return;
  ctx.save();
  ctx.translate(P.x, P.y);
  if (P.slide) {
    // 배 미끄럼
    ctx.fillStyle = '#1c2236';
    ctx.beginPath(); ctx.ellipse(0, -13, 28, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(2, -8, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1c2236';
    ctx.beginPath(); ctx.arc(24, -16, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(27, -18, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(28, -18, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff9a1f';
    ctx.beginPath(); ctx.moveTo(32, -16); ctx.lineTo(41, -13); ctx.lineTo(32, -11); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-28, -10, 7, 3, 0.3, 0, Math.PI * 2); ctx.fill();
  } else {
    const run = P.onGround ? Math.sin(P.anim) : 0;
    ctx.rotate(P.onGround ? run * 0.08 : -0.15);
    // 발
    ctx.fillStyle = '#ff9a1f';
    ctx.beginPath(); ctx.ellipse(-7 + run * 6, -2, 8, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7 - run * 6, -2, 8, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    // 몸
    ctx.fillStyle = '#1c2236';
    ctx.beginPath(); ctx.ellipse(0, -26, 18, 25, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(4, -22, 12, 19, 0, 0, Math.PI * 2); ctx.fill();
    // 날개 (파닥파닥)
    ctx.fillStyle = '#1c2236';
    ctx.save(); ctx.translate(-12, -32); ctx.rotate(-0.6 - Math.abs(Math.sin(P.anim * 1.5)) * 0.9);
    ctx.beginPath(); ctx.ellipse(0, 10, 5, 14, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // 머리
    ctx.beginPath(); ctx.arc(4, -50, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(9, -53, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(11, -53, 2.5, 0, Math.PI * 2); ctx.fill();
    // 겁먹은 땀방울
    if (gap < 40) { ctx.fillStyle = '#7fd3ff'; ctx.beginPath(); ctx.ellipse(-8, -60 + (t * 30 % 8), 3, 4.5, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#ff9a1f';
    ctx.beginPath(); ctx.moveTo(15, -50); ctx.lineTo(27, -46); ctx.lineTo(15, -43); ctx.fill();
  }
  ctx.restore();
}

function drawDino() {
  // 공룡 위치: gap 100 -> 화면 밖, gap 0 -> 펭귄 바로 뒤
  let target = P.x - 70 - gap * 3.4;
  if (state === 'over' && overReason && overReason.includes('공룡')) target = P.x - 60;
  dinoX += (target - dinoX) * 0.12;
  if (dinoX < -240) return;
  const x = dinoX, y = GROUND;
  const step = state === 'play' ? Math.sin(t * speed / 45) : Math.sin(t * 3) * 0.3;
  const jaw = state === 'over' ? 0.15 + Math.abs(Math.sin(dinoBite * 6)) * 0.5 : 0.25 + Math.abs(Math.sin(t * 5)) * 0.35;
  ctx.save();
  ctx.translate(x, y + Math.abs(step) * -4);
  const body = '#4e7a3a', dark = '#3a5d2b', belly = '#a9c47a';
  // 뒷다리
  ctx.fillStyle = dark;
  ctx.save(); ctx.translate(-10, -70); ctx.rotate(-step * 0.5);
  ctx.fillRect(-12, 0, 24, 52); ctx.fillRect(-12, 48, 34, 12); ctx.restore();
  // 꼬리
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-30, -110); ctx.quadraticCurveTo(-120, -110 + step * 8, -170, -90 + step * 10);
  ctx.quadraticCurveTo(-110, -70, -20, -70); ctx.fill();
  // 몸통
  ctx.beginPath(); ctx.ellipse(0, -100, 52, 40, -0.25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(18, -88, 30, 22, -0.3, 0, Math.PI * 2); ctx.fill();
  // 등 가시
  ctx.fillStyle = '#c96a2c';
  for (let i = 0; i < 6; i++) {
    const sx = -80 + i * 22, sy = -112 - Math.sin(i / 5 * Math.PI) * 26;
    ctx.beginPath(); ctx.moveTo(sx - 7, sy + 6); ctx.lineTo(sx, sy - 10); ctx.lineTo(sx + 7, sy + 6); ctx.fill();
  }
  // 앞다리
  ctx.fillStyle = body;
  ctx.save(); ctx.translate(20, -70); ctx.rotate(step * 0.5);
  ctx.fillRect(-12, 0, 24, 52); ctx.fillRect(-12, 48, 34, 12); ctx.restore();
  // 작은 팔
  ctx.fillStyle = dark;
  ctx.save(); ctx.translate(40, -96); ctx.rotate(0.6 + Math.sin(t * 8) * 0.3);
  ctx.fillRect(0, -3, 18, 6); ctx.restore();
  // 목 + 머리
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(40, -130, 20, 22, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.translate(55, -150);
  // 위턱
  ctx.save(); ctx.rotate(-jaw * 0.5);
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(-14, -16); ctx.lineTo(48, -10); ctx.lineTo(52, 6); ctx.lineTo(-10, 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(4 + i * 8, 6); ctx.lineTo(8 + i * 8, 14); ctx.lineTo(12 + i * 8, 6); ctx.fill(); }
  ctx.fillStyle = '#ffde3b'; ctx.beginPath(); ctx.arc(12, -5, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.fillRect(12, -8, 2.5, 6);
  ctx.fillStyle = dark; ctx.fillRect(4, -14, 18, 4);
  ctx.restore();
  // 아래턱
  ctx.save(); ctx.rotate(jaw * 0.6);
  ctx.fillStyle = '#b04848'; ctx.fillRect(-4, 6, 46, 6);
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(44, 10); ctx.lineTo(40, 22); ctx.lineTo(-6, 20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(6 + i * 8, 11); ctx.lineTo(10 + i * 8, 4); ctx.lineTo(14 + i * 8, 11); ctx.fill(); }
  ctx.restore();
  ctx.restore();
  // 입김
  if (Math.random() < 0.3) parts.push({ x: x + 105, y: y - 148, vx: 60 + Math.random() * 40, vy: -20, life: 0.5, c: 'rgba(255,255,255,0.7)', r: 4 });
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(5,12,30,0.55)';
  ctx.fillRect(16, 14, 290, 64);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`점수 ${score}`, 30, 42);
  ctx.font = '15px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#bfe3ff';
  ctx.fillText(`${Math.floor(dist)}m 도주   최고 ${best}`, 30, 66);
  // 거리 게이지
  const gx = W - 286, gy = 22;
  ctx.fillStyle = 'rgba(5,12,30,0.55)'; ctx.fillRect(gx - 14, 14, 284, 48);
  ctx.fillStyle = '#fff'; ctx.font = '13px "Malgun Gothic", sans-serif';
  ctx.fillText('🦖 공룡과의 거리', gx, gy + 12);
  ctx.fillStyle = '#233';
  ctx.fillRect(gx, gy + 20, 256, 12);
  const c = gap < 30 ? '#ff4b4b' : gap < 55 ? '#ffb340' : '#5be08a';
  ctx.fillStyle = c; ctx.fillRect(gx, gy + 20, 256 * gap / 100, 12);
}

function center(txt, y, size, color = '#fff') {
  ctx.font = `bold ${size}px "Malgun Gothic", sans-serif`;
  ctx.textAlign = 'center';
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(5,12,30,0.8)';
  ctx.strokeText(txt, W / 2, y);
  ctx.fillStyle = color; ctx.fillText(txt, W / 2, y);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawSky();
  drawGround();
  for (const o of objs) {
    if (o.type === 'ice') drawIce(o);
    else if (o.type === 'ptero') drawPtero(o);
    else if (o.type === 'fish') drawFish(o);
  }
  if (state !== 'title') drawPenguin();
  drawDino();
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff';
  for (const s of snow) { ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 위험 비네트
  if (state === 'play' && gap < 35) {
    const a = (35 - gap) / 35 * (0.5 + 0.2 * Math.sin(t * 10));
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.7);
    vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(1, `rgba(255,0,0,${a})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.4})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'play') {
    drawHUD();
    if (t < startT + 3) center('달려! 공룡이 쫓아온다!', 150, 34, '#ffdd55');
  } else if (state === 'title') {
    ctx.fillStyle = 'rgba(5,12,30,0.45)'; ctx.fillRect(0, 0, W, H);
    center('남극 대탈출', 160, 64, '#bfe9ff');
    center('얼음이 갈라지고… 공룡이 깨어났다!', 215, 24, '#ffdd55');
    center('스페이스 / ↑ : 점프 (공중에서 한 번 더!)', 290, 20);
    center('↓ : 배로 미끄러지기 (익룡 피하기)', 322, 20);
    center('🐟 물고기를 먹으면 공룡과 거리가 벌어져요', 354, 20);
    center('크레바스에 빠지거나 공룡에게 잡히면 끝!', 386, 20, '#ff9a9a');
    if (Math.sin(t * 4) > -0.3) center('스페이스 / 클릭으로 시작', 460, 26, '#ffffff');
  } else {
    ctx.fillStyle = 'rgba(5,12,30,0.5)'; ctx.fillRect(0, 0, W, H);
    center(overReason, 190, 52, '#ff6b6b');
    center(`점수 ${score}  ·  ${Math.floor(dist)}m`, 255, 30);
    center(score >= best && score > 0 ? '🎉 신기록!' : `최고 기록 ${best}`, 300, 24, '#ffdd55');
    if (Math.sin(t * 4) > -0.3) center('스페이스 / 클릭으로 다시 도망치기', 400, 24);
  }
}

let startT = 0;
const _reset2 = reset;
reset = function () { _reset2(); startT = t; dinoX = -300; };

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
speed = 360; dist = 0; score = 0; gap = 60; objs = []; parts = []; shake = 0; flash = 0;
dinoX = -300;
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
